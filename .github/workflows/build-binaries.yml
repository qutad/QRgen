name: Build Binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r qr_generator-macos.zip qr_generator.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr_generator-macos
          path: build/macos/Build/Products/Release/qr_generator-macos.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath qr_generator-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr_generator-windows
          path: qr_generator-windows.zip

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libfuse2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

          cp web/icons/Icon-512.png AppDir/qr_generator.png
          cp web/icons/Icon-512.png AppDir/usr/share/icons/hicolor/512x512/apps/qr_generator.png

          cat > AppDir/qr_generator.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=QR Generator
          Exec=qr_generator
          Icon=qr_generator
          Categories=Utility;
          Terminal=false
          EOF

          cp AppDir/qr_generator.desktop AppDir/usr/share/applications/qr_generator.desktop

          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          export LD_LIBRARY_PATH="\$HERE/usr/bin/lib:\$LD_LIBRARY_PATH"
          exec "\$HERE/usr/bin/qr_generator" "\$@"
          EOF

          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir qr_generator-linux-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr_generator-linux-appimage
          path: qr_generator-linux-x86_64.AppImage

  release:
    name: Publish GitHub Release
    needs:
      - build-macos
      - build-windows
      - build-linux-appimage
    runs-on: ubuntu-22.04
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/qr_generator-macos/qr_generator-macos.zip
            artifacts/qr_generator-windows/qr_generator-windows.zip
            artifacts/qr_generator-linux-appimage/qr_generator-linux-x86_64.AppImage
